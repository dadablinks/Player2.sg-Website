<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fuwa | Player2.sg</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0d0f11;
        color: #ebeeef;
        font-family: system-ui, sans-serif;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 28px;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(0deg, #0b1015ef, #0b1015bd),
          url("/assets/fuwa-hall.jpg") center/cover;
        z-index: -1;
      }
      main {
        max-width: 500px;
        width: 100%;
      }
      a {
        color: inherit;
      }
      small {
        color: #e53c42;
      }
      h1 {
        font-size: 72px;
        margin: 28px 0 12px;
      }
      h2 {
        font-size: 26px;
        font-weight: 500;
      }
      p {
        line-height: 1.8;
        color: #aab3bd;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: center;
        margin-top: 30px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 0;
        padding: 16px 24px;
        color: #ffffff;
        background: #e53c42;
        cursor: pointer;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid white;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">player2.sg</a>
      <h1>Fuwa.</h1>
      <small>TEMPLE OFFLINE</small>
      <h2>The server is currently offline.</h2>
      <p>
        The temple is unavailable right now. Come back shortly to explore and
        meet other visitors.
      </p>
      <div class="actions">
        <button onclick="location.reload()">Try again</button
        ><a href="/">Back to Player2</a>
      </div>
    </main>
  </body>
</html>
