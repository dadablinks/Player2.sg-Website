<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/match3/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10152a">
  <meta name="description" content="Play Gem Garden, a match-three puzzle with classic jewels and a Chinese New Year skin.">
  <title>Gem Garden</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10152a; }
    canvas { display: block; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #63e8ff; outline-offset: -2px; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: .65rem; text-align: center; color: #fff0ce; font: 17px system-ui; padding: 1.5rem; }
    #loading strong { color: #90ebff; font: bold clamp(2rem, 7vw, 4rem) Georgia, serif; }
    #loading progress { width: min(18rem, 70vw); margin: .4rem auto; accent-color: #63e8ff; }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Gem Garden. Use the arrow keys and Enter, or click or swipe to swap gems."></canvas>
  <div id="loading" role="status"><strong>Gem Garden</strong><span id="notice">Opening the garden…</span><progress id="progress" aria-label="Loading progress"></progress></div>
  <noscript>Enable JavaScript to play Gem Garden.</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"garden-9640597ba7fe.pck":392408,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const nativeFetch = window.fetch.bind(window);
    const engineURL = new URL('index.wasm', document.baseURI);
    window.fetch = async (input, options) => {
      const name = typeof input === 'string' || input instanceof URL ? input : input.url;
      if (new URL(name, document.baseURI).href !== engineURL.href) return nativeFetch(input, options);
      const compressed = await nativeFetch(new URL('index.wasm.gz', engineURL), options);
      if (!compressed.ok) throw new Error('Could not load the game engine. Please try reloading.');
      const bytes = compressed.body.pipeThrough(new DecompressionStream('gzip'));
      return new Response(bytes, { headers: { 'Content-Type': 'application/wasm' } });
    };
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length || !('DecompressionStream' in window)) {
      notice.textContent = 'Use a current browser with WebGL 2 to play Gem Garden.';
      progress.remove();
    } else {
      new Engine(config).startGame({
        mainPack: 'garden-9640597ba7fe.pck',
        onProgress(current, total) {
          if (total > 0) {
            progress.max = total;
            progress.value = current;
          }
        },
      }).then(() => loading.remove()).catch((error) => {
        console.error(error);
        notice.textContent = 'The garden could not open. Please reload to try again.';
        progress.remove();
      }).finally(() => { window.fetch = nativeFetch; });
    }
  </script>
</body>
</html>
